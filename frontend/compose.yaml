name: travelfriends-frontend-dev
services:
  frontend:
    build:
      context: .
      target: development
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8000}
      VITE_API_URL: ${VITE_API_URL:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules:
