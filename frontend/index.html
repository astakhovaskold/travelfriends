<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Travel Friends</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--ink:#0B1B3F;--night:#FBF6EC;--deep:#FFFFFF;--line:#E7DDCB;--tx:#0B1B3F;--mu:#6B7794;--blue:#1565C0;--a0:#FF6B4A;--a1:#F2547D;--a2:#4DB2FF;--a3:#2FC48D;--a4:#A592FF;--a5:#FFA03C}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:500 16px/1.4 'Bricolage Grotesque',system-ui,sans-serif;background:radial-gradient(110% 40% at 50% -6%,#FFE3D6 0,var(--night) 70%) var(--night);color:var(--tx);overflow:hidden;position:fixed;inset:0;width:100%;overscroll-behavior:none}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--a0);outline-offset:2px}
.a0{--a:var(--a0)}.a1{--a:var(--a1)}.a2{--a:var(--a2)}.a3{--a:var(--a3)}.a4{--a:var(--a4)}.a5{--a:var(--a5)}
.mu{color:var(--mu)}.c{text-align:center;margin-top:30px}
#app{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 8px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.lang{background:var(--deep);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;color:var(--mu)}
.lang b{color:var(--a0)}
.card-sh{box-shadow:0 6px 18px #0B1B3F14}
#body{flex:1;min-height:0;display:flex;flex-direction:column}
.q,.f{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;background:var(--deep);color:var(--tx);margin-bottom:12px}
.q::placeholder,.f::placeholder{color:var(--mu)}
textarea.f{min-height:84px;resize:vertical}
.list,.scroll{flex:1;overflow:auto;padding-bottom:16px;perspective:900px}
.flt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--deep);border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;margin-bottom:10px;box-shadow:0 4px 14px #0B1B3F12;transform-origin:50% 0;animation:flip .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes flip{from{transform:rotateX(-85deg);opacity:0}}
.dt{background:var(--a);color:var(--ink);border-radius:12px;min-width:58px;padding:8px 0;text-align:center;font-family:ui-monospace,Menlo,monospace}
.dt b{display:block;font-size:24px;line-height:1}.dt span{font-size:12px}
.mid{flex:1;min-width:0}
.mid h3{font-weight:800;font-size:21px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid p{font-size:14px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;background:var(--a);color:var(--ink);font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px}
.seat{text-align:center;color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.seat b{display:block;font-size:22px;line-height:1}.seat span{font-size:11px;color:var(--mu)}
.empty{text-align:center;padding:60px 20px}.empty h2{font-size:24px;margin-bottom:6px}
nav{display:flex;align-items:stretch;justify-content:space-around;background:var(--deep);border:1px solid var(--line);border-radius:22px;padding:6px 4px;box-shadow:0 6px 20px #0B1B3F18;flex:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mu);font-weight:700;font-size:12px;padding:6px 4px;border-radius:16px}nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=true]{color:var(--ink);background:#FF6B4A1f}nav button[aria-current=true] svg{stroke:var(--a0);stroke-width:2.3}


.who{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.who h2{font-weight:800;font-size:24px}.who>div{flex:1;min-width:0}.who>.ava{flex:none;width:62px;height:62px}
.ava{width:62px;height:62px;border-radius:50%;background:var(--a4);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}
.scroll h3{font-weight:800;font-size:18px;margin:18px 0 10px}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:8px 14px;color:var(--mu)}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:4px}
.st{aspect-ratio:1;border:3px solid var(--a);outline:1.5px dashed var(--a);outline-offset:3px;border-radius:50%;background:none;color:var(--a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;font-weight:800;font-size:13px;line-height:1.1;transform:rotate(var(--r));overflow-wrap:anywhere;overflow:hidden}
.st small{font-size:11px;font-weight:700;font-family:ui-monospace,Menlo,monospace;opacity:.85}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;flex:none}
.chip{flex:none;background:var(--deep);border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed=true]{background:var(--a0);border-color:var(--a0);color:var(--ink)}
.opts{margin:-8px 0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.opts:empty{display:none}
.opt{display:block;width:100%;text-align:left;background:var(--night);border:0;border-bottom:1px solid var(--line);padding:10px 12px;font-size:15px}
.chatc{margin:auto;text-align:center;max-width:320px;display:flex;flex-direction:column;gap:12px;align-items:center}
.chatc .big{font-size:56px}.chatc h2{font-weight:800;font-size:24px}
.cta.alt{background:none;border:1px solid var(--line);color:var(--tx);margin-top:10px}
.big{font-size:56px;line-height:1.1;margin-bottom:6px}
.ex{background:var(--night);border:1px dashed var(--line);border-radius:14px;padding:12px;margin:12px 0;color:var(--a0)}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--a0);width:22px}
.rules{padding-left:20px;margin:10px 0}.rules li{margin-bottom:8px}
.bt{margin:12px 0}.bt .ghost{flex:1}
.cb{display:flex;flex-direction:column;height:min(82vh,680px)}
.ch{padding:18px 56px 6px 20px}.ch b{font-weight:800;font-size:20px;display:block}
.note{padding:0 20px 8px;font-size:13px;color:var(--mu)}
.msgs{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;background:var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}
.m.me{align-self:flex-end;background:var(--a0);color:var(--ink);border-radius:16px 16px 4px 16px}
.m small{display:block;font-size:12px;font-weight:700;color:var(--blue);margin-bottom:2px}
.rp{background:none;border:0;color:var(--mu);font-size:12px;padding:0 4px}
.send{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.send .f{margin:0;flex:1}
.sb{width:48px;border:0;border-radius:14px;background:var(--a0);color:var(--ink);font-size:20px}
.ms{position:fixed;left:0;right:0;top:0;height:var(--tg-viewport-height,100dvh);background:#0B1B3Fee;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
.ms.on{opacity:1;pointer-events:auto}
.mb{position:relative;width:100%;max-width:420px;max-height:92%;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:26px;transform:translateY(24px) scale(.97);transition:transform .3s ease-out;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ms.on .mb{transform:none}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:#0B1B3F22;color:var(--ink);font-size:18px;z-index:2}
.form{padding:24px 20px 20px}.form h2{font-weight:800;font-size:24px;margin-bottom:14px}
.form .x{background:var(--line);color:var(--tx)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.two{display:flex;gap:10px;align-items:flex-end}.two>div{flex:1;min-width:0}
.pt{background:var(--a);color:var(--ink);padding:22px 20px 18px}
.mini{font-size:13px;font-weight:700;opacity:.75;margin-right:40px}
.pt h2{font-weight:800;font-size:clamp(32px,11vw,46px);line-height:1;margin:10px 0 14px;overflow-wrap:anywhere;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid small{display:block;font-size:12px;font-weight:700;opacity:.7}.grid b{font-weight:800}
.tearl{border-top:2px dashed #0B1B3F33;position:relative}
.tearl:before,.tearl:after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:#1d2a4a}
.tearl:before{left:-12px}.tearl:after{right:-12px}
.stub{padding:16px 20px 20px;transition:transform .7s cubic-bezier(.5,0,1,.6),opacity .7s;transform-origin:0 0}
.stub.torn{transform:translateY(120px) rotate(8deg);opacity:0}
.stub p{margin-bottom:12px}
.bar{height:34px;margin-bottom:14px;opacity:.7;background:repeating-linear-gradient(90deg,var(--tx) 0 2px,transparent 2px 5px,var(--tx) 5px 6px,transparent 6px 10px)}
.cta{width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:17px;background:var(--ink);color:#fff}
.cta.pri{background:var(--a0);color:var(--ink)}
.cta:disabled{background:#C9CFDD;color:#fff}
.cta:active{transform:scale(.98)}
.stamp{position:absolute;left:50%;top:36%;width:132px;height:132px;margin:-66px;border:5px solid var(--ink);outline:2px dashed var(--ink);outline-offset:5px;border-radius:50%;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:22px;transform:rotate(-14deg);animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none}
@keyframes stamp{from{transform:rotate(-34deg) scale(2.6);opacity:0}}
.sent{padding:14px 20px 20px;font-weight:700;color:var(--a3)}
.toast{position:fixed;left:16px;right:16px;bottom:100px;background:var(--ink);color:#fff;font-weight:700;padding:12px;border-radius:12px;text-align:center;z-index:30}
#splash{--night:#0A0F2C;--mu:#9AA6D6;--tx:#F4F6FF;color:var(--tx);position:fixed;inset:0;z-index:20;background:radial-gradient(120% 70% at 50% 20%,#25339A 0,var(--night) 65%) var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.orb{position:relative;width:150px;height:150px;margin-bottom:56px}
.earth{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 30%,#5FD8FF,#1B6DFF 55%,#0A2A8C);box-shadow:0 0 50px #35D0FF55}
.earth:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 28%,transparent 38%,#0008 100%)}
.land{display:flex;width:600px;animation:spin 9s linear infinite}
.land svg{width:300px;height:150px;flex:none}
@keyframes spin{to{transform:translateX(-300px)}}
.ring{position:absolute;inset:-38px;border:1.5px dashed #ffffff40;border-radius:50%;animation:orbit 6s linear infinite}
.plane{position:absolute;top:-14px;left:50%;margin-left:-13px;transform:rotate(90deg)}
@keyframes orbit{to{transform:rotate(360deg)}}
#splash h1{font-weight:800;font-size:38px;letter-spacing:-.03em}
#splash p{color:var(--mu)}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;text-align:left}
.rt{color:var(--a0);font-weight:800;white-space:nowrap}.rt.n{color:#0F9D6E}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.metrics div{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.metrics b{display:block;font-size:22px;font-weight:800}.metrics span{font-size:12px;color:var(--mu)}
.rev{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.rev small{color:var(--mu)}.rev p{margin-top:4px;overflow-wrap:anywhere}
.tgp{display:inline-block;background:var(--line);border-radius:99px;padding:3px 10px;font-size:13px;margin:4px 6px 2px 0}
.tgp.neg{background:#FF5C7A33;color:var(--a1)}
.sp{display:flex;gap:4px;justify-content:center;margin:10px 0}
.sp button{background:none;border:0;font-size:40px;line-height:1;color:var(--line);padding:2px 4px}
.sp button.on{color:var(--a0)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.mpanel{border-bottom:1px solid var(--line);max-height:42%;overflow:auto;padding:4px 16px 10px;flex:none}
.mr{display:flex;align-items:center;gap:8px;padding:6px 0}
.ghost.sm{padding:5px 10px;font-size:13px}
.m.sys{align-self:center;background:none;border-radius:0;color:var(--mu);font-size:13px;padding:2px 8px;text-align:center;max-width:92%}
.pt .lnk{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;margin-bottom:12px;color:#fff;background:linear-gradient(120deg,#0E2A6B,#1E6FD9 60%,#4DB2FF);flex:none}
.hero h2{font-weight:800;font-size:22px;line-height:1.1;max-width:75%}.hero p{font-size:14px;opacity:.9;margin-top:4px;max-width:75%}
.hero .pl{position:absolute;right:-6px;top:6px;font-size:64px;transform:rotate(-12deg);filter:drop-shadow(0 6px 10px #0004)}
.pop{display:flex;gap:10px;overflow-x:auto;margin-bottom:12px;flex:none;padding-bottom:2px}
.pop button{flex:none;width:78px;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;font-weight:700;font-size:13px;box-shadow:0 3px 10px #0B1B3F10}
.pop span{display:block;font-size:30px;line-height:1.1}
.sw{display:flex;align-items:center;gap:10px;margin:2px 0 12px}.sw input{width:22px;height:22px;accent-color:var(--a0)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg .chip{flex:1;text-align:center;padding:8px 6px}
.match{display:inline-block;background:#2FC48D33;color:#0F7A57;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;margin-top:6px}
.badge{display:inline-block;border:1px solid var(--line);background:var(--night);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.req{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.req .mid{flex:1;min-width:0}.req .ghost.sm.ok{background:var(--a3);border-color:var(--a3);color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;height:50px;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.f{display:block;max-width:100%}
.ob .big,.form .big{margin-top:4px}
#splash p{text-align:center;padding:0 28px;max-width:360px}
#splash #tag{color:#fff;font-weight:700;font-size:19px}
#splash #tag2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
#splash .sl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px;max-width:330px}
#splash .sl button{background:#ffffff14;border:1px solid #ffffff40;color:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px}
#splash .sl button.on{background:#FF6B4A;border-color:#FF6B4A;color:#0B1B3F}

.map{position:relative;z-index:0;isolation:isolate;height:clamp(190px,32vh,300px);border-radius:20px;overflow:hidden;flex:none;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 4px 14px #0B1B3F12}
.map[hidden]{display:none}
.mh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px;flex:none;font-weight:800;min-height:30px}
.pinwrap{background:none;border:0}
.pin{position:relative;width:44px;height:44px}
.pin span{position:absolute;inset:0;border-radius:50%;background:var(--a);border:3px solid #fff;box-shadow:0 4px 12px #0B1B3F55;display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .2s}
.pin b{position:absolute;right:-4px;top:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff;z-index:2}
.pin i{position:absolute;top:48px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--ink);border-radius:99px;padding:1px 8px;font:700 11px/16px 'Bricolage Grotesque',system-ui,sans-serif;font-style:normal;box-shadow:0 2px 8px #0B1B3F33}
.pin.fresh span{animation:pulse 2s infinite}
.pin.sel span{transform:scale(1.18);border-color:var(--a0)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #FF6B4A99}70%{box-shadow:0 0 0 14px #FF6B4A00}100%{box-shadow:0 0 0 0 #FF6B4A00}}

html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
.smap{position:absolute;inset:0;background:#CFE6F7;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.smap svg{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;pointer-events:none}
.smap .pl{position:absolute;left:0;top:0;width:0;height:0}
.smap .pw{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;background:none;border:0}
.smap .zb{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.smap .zb button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:20px;font-weight:800;line-height:1;padding:0;box-shadow:0 2px 8px #0B1B3F22}
.smap .dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#FF6B4A;border:3px solid #fff;box-shadow:0 2px 8px #0B1B3F66}
.slogo{width:128px;height:128px;margin-bottom:22px;filter:drop-shadow(0 10px 30px #1E55E877);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}

nav{overflow:visible;position:relative}
.navplus{flex:none;align-self:flex-start;width:58px;height:58px;margin:-26px 6px 0;border-radius:50%;border:4px solid var(--night);background:var(--a0);color:var(--ink);font-size:32px;line-height:1;padding:0;box-shadow:0 8px 22px #FF6B4A66;display:flex;align-items:center;justify-content:center}
.navplus:active{transform:scale(.94)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pc{background:var(--deep);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;box-shadow:0 4px 14px #0B1B3F12}
.pi{height:112px;background:linear-gradient(135deg,var(--a),#ffffff99);background-size:cover;background-position:center}
.pc b{display:block;padding:8px 10px 0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc span{display:block;padding:0 10px 10px;font-size:13px;color:var(--mu)}
.pt.ph{color:#fff;background-size:cover;background-position:center}
.pt.ph .lnk{color:#fff}.pt.ph .mini{opacity:.9}
.mm{height:130px;border-radius:14px;overflow:hidden;margin:10px 0;isolation:isolate;position:relative;z-index:0;border:1px solid var(--line)}
.mm[hidden]{display:none}
.rx{display:flex;flex-wrap:wrap;gap:4px}.rx:empty{display:none}
.rx{margin-top:4px}
.rc{border:1px solid var(--line);background:var(--deep);color:var(--ink);border-radius:99px;padding:1px 8px;font-size:13px}
.rc.on{border-color:var(--a0);background:#FFE3DA}
.rb{background:none;border:0;opacity:.45;font-size:14px;padding:0 0 0 6px;float:right}
.pk{display:flex;gap:6px;margin-top:6px;clear:both}
.pk button{background:var(--deep);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:18px;padding:0}
</style>
</head>
<body>

    pins.forEach(p=>{const q=xy(p.c);p.el.style.left=(q[0]*S+tx0)+'px';p.el.style.top=(q[1]*S+ty0)+'px'});};
  const zoomAt=(f,px,py)=>{const S0=base()*k;const wx=(px-tx0)/S0,wy=(py-ty0)/S0;k=Math.min(Math.max(k*f,1),o.maxk||40);const S=base()*k;tx0=px-wx*S;ty0=py-wy*S;apply()};

    setPins(list){pl.innerHTML='';pins=list.map(it=>{const el=document.createElement('button');el.type='button';el.className='pw';el.innerHTML=it.html;el.onclick=e=>{e.stopPropagation();it.onclick&&it.onclick()};pl.appendChild(el);return {c:it.c,el}});apply()},
    k:()=>k,

    fit(cs,maxk){

      k=kk;const S=base()*k;tx0=cw/2-(x1+x2)/2*S;ty0=ch/2-(y1+y2)/2*S;apply()},

      if(p.blocked)go();else ask(tx('q_block'),go);
    };
    $('#rpu').onclick=()=>run(async()=>{await api(`/users/${id}/report`,'POST');toast(tx('reported'))});
  }
})}

function openRate(tid,only){run(async()=>{
  const d=await api(`/trips/${tid}/people`);
  if(!d.ended)throw new Error('notended');
  const qu=d.members.filter(m=>m.id!==d.me&&!m.rated&&(!only||m.id===only));
  if(!qu.length){toast(tx('norate'));return}
  let i=0;
  const step=()=>{
    if(i>=qu.length){closeM();toast(tx('rated_ok'));show(tab);return}
    const m=qu[i];let s=0;const sel=new Set();
    modal(`<div class="form"><button class="x" aria-label="Close">✕</button><h2>${tx('rate_t')}</h2><p class="mu">${esc(dn(d.dest))}</p><h3 style="margin:10px 0 0;font-size:20px">${esc(m.name)}${m.age?', '+m.age:''}</h3><div class="sp" id="sp">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n}">★</button>`).join('')}</div><div class="chips wrap" id="tgs">${TAGS.map(k=>`<button type="button" class="chip" data-t="${k}" aria-pressed="false">${tx('tag_'+k)}</button>`).join('')}</div><textarea class="f" id="rtx" maxlength="300" placeholder="${tx('rate_ph')}"></textarea><button class="cta" id="go">${tx('rate_send')}</button><button class="cta alt" id="sk">${tx('rate_skip')}</button></div>`);
    document.querySelectorAll('#sp button').forEach(b=>b.onclick=()=>{s=+b.dataset.n;hap();document.querySelectorAll('#sp button').forEach(o=>o.classList.toggle('on',+o.dataset.n<=s))});
    document.querySelectorAll('#tgs .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.t;sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute('aria-pressed',sel.has(k));hap()});
    $('#sk').onclick=()=>{i++;step()};
    $('#go').onclick=()=>run(async()=>{
      if(!s){hap();toast(tx('pickstars'));return}
      await api('/reviews','POST',{trip_id:tid,to_id:m.id,stars:s,tags:[...sel],text:$('#rtx').value});
      good();i++;step();
    });
  };
  step();
})}

function rulesView(){
  modal(`<div class="form ob"><button class="x" aria-label="Close">✕</button><div class="big">📜</div><h2>${tx('rulesT')}</h2><ul class="rules">${T[L].rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><button class="cta" id="nx">${tx('ok')}</button></div>`);
  $('#nx').onclick=closeM;
}
function onboarding(must){
  let i=0;const S=T[L].ob,n=S.length+1;
  const draw=()=>{
    const last=i===S.length;
    modal(`<div class="form ob"><button class="x" aria-label="Close">✕</button>${last?`<div class="big">📜</div><h2>${tx('rulesT')}</h2><ul class="rules">${T[L].rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:`<div class="big">${S[i].e}</div><h2>${S[i].h}</h2><p>${S[i].p}</p>${S[i].ex?`<div class="ex">${S[i].ex}</div>`:''}`}<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button class="cta" id="nx">${last?(must?tx('accept'):tx('ok')):tx('next')}</button></div>`,must);
    $('#nx').onclick=()=>{
      if(!last){i++;hap();draw();return}
      if(!must){closeM();return}
      run(async()=>{await api('/rules','POST');good();closeM();gate()});
    };
  };
  draw();
}

function gate(){
  if(ms.classList.contains('on')&&locked)return;
  run(async()=>{const m=await api('/me');if(!m.rules_ok)onboarding(true);else if(!m.registered)regForm()});
}
function minorScreen(){
  modal(`<div class="form c"><div class="big">🔞</div><h2>${tx('minor_t')}</h2><p>${tx('minor_p')}</p></div>`,true);
}
function regForm(){
  modal(`<div class="form"><div class="big">🪪</div><h2>${tx('reg_t')}</h2><p class="mu" style="margin-bottom:12px">${tx('reg_p')}</p><label for="bd0">${tx('birth')}</label><input class="f" id="bd0" type="date" min="1920-01-01" max="${new Date().toISOString().slice(0,10)}"><label>${tx('gender')}</label><div class="seg" id="gs"></div><label for="rc">${tx('city')}</label><input class="f" id="rc" maxlength="60"><label for="ra">${tx('about')}</label><textarea class="f" id="ra" maxlength="500" placeholder="${tx('pha')}"></textarea><label>${tx('vibe_t')}</label><p class="mu" style="font-size:13px;margin:-2px 0 6px">${tx('vibe_h')}</p><div class="chips wrap" id="vb"></div><button class="cta" id="rg">${tx('reg_go')}</button></div>`,true);
  let gender='x';const vs=new Set();
  seg($('#gs'),[['f',tx('g_f')],['m',tx('g_m')],['x',tx('g_x')]],gender,v=>gender=v);vibePicker($('#vb'),vs);
  $('#rg').onclick=()=>run(async()=>{
    const b=$('#bd0').value;if(!b)throw new Error('baddate');
    await api('/register','POST',{birth:b,gender,vibe:[...vs],city:$('#rc').value,about:$('#ra').value});
    refreshMe();good();closeM();toast(tx('welcome'));show(tab);
  });
}

function passport(){
  $('#body').innerHTML='<p class="mu c">…</p>';
  run(async()=>{
    const [m,d]=await Promise.all([api('/me'),api('/my')]);
    const all=[...d.mine,...d.joined];
    const av=U.photo_url?`<img src="${esc(U.photo_url)}" alt="">`:esc((m.name||'?')[0]);
    $('#body').innerHTML=`<div class="scroll"><div class="who"><div class="ava">${av}</div><div><h2>${esc(m.name)}</h2><p class="mu">${[yo(m.age),esc(m.city||'')].filter(Boolean).join(' · ')}</p></div><button class="ghost" id="edit">${tx('edit')}</button></div>${m.about?`<p>${esc(m.about)}</p>`:''}
    <div class="metrics"><div><b>${m.trips}</b><span>${tx('trips_done')}</span></div><div><b>${m.friends||0}</b><span>${tx('friends')}</span></div><div><b>${m.cnt?'★ '+m.avg:'—'}</b><span>${tx('rating')}${m.cnt?' ('+m.cnt+')':''}</span></div></div>
    <button class="ghost" id="pub0" style="width:100%">${tx('myprof')}</button>
    <h3>${tx('stamps')}</h3>${all.length?`<div class="stamps">${all.map((x,i)=>`<button class="st a${ci(x.dest)}" data-s="${i}" style="--r:${(ci(x.dest+i)-2.5)*5}deg">${esc(dn(x.dest))}<small>${fmt(x.date_from)||'✈'}</small></button>`).join('')}</div>`:`<p class="mu">${tx('nost')}</p>`}
    ${d.mine.length?`<h3>${tx('mytrips')}</h3>${d.mine.map((x,i)=>row(x,i)).join('')}`:''}</div>`;
    document.querySelectorAll('.st').forEach(b=>b.onclick=()=>openPass(all[+b.dataset.s]));
    document.querySelectorAll('.scroll .flt').forEach(b=>b.onclick=()=>openPass(d.mine[+b.dataset.i]));
    $('#pub0').onclick=()=>openProfile(m.id);
    $('#edit').onclick=()=>{hap();modal(`<div class="form"><button class="x" aria-label="Close">✕</button><h2>${esc(m.name)}</h2><label for="city">${tx('city')}</label><input class="f" id="city" maxlength="60" value="${esc(m.city)}"><label for="ab">${tx('about')}</label><textarea class="f" id="ab" maxlength="500" placeholder="${tx('pha')}">${esc(m.about)}</textarea><label>${tx('vibe_t')}</label><div class="chips wrap" id="vb"></div><button class="cta" id="sv">${tx('save')}</button></div>`);
      const vs=new Set((m.vibe||'').split(',').filter(Boolean));vibePicker($('#vb'),vs);
      $('#sv').onclick=()=>run(async()=>{await api('/profile','POST',{city:$('#city').value,about:$('#ab').value,vibe:[...vs]});refreshMe();good();closeM();toast(tx('saved'));passport()})};
  });
}

function picker(inp,box){
  let pick=null;
  inp.oninput=()=>{pick=null;const v=inp.value.trim().toLowerCase();
    const m=v?CITY.filter(c=>(c.en+' '+c.ru+' '+c.ce+' '+c.cr).toLowerCase().includes(v)).sort((x,y)=>(y.en===y.ce)-(x.en===x.ce)).slice(0,8):[];
    box.innerHTML=m.map((c,i)=>`<button type="button" class="opt" data-i="${i}">${esc(L==='ru'?c.ru:c.en)}${c.en===c.ce?'':` <span class="mu">${esc(L==='ru'?c.cr:c.ce)}</span>`}</button>`).join('');
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick=m[+b.dataset.i];inp.value=L==='ru'?pick.ru:pick.en;box.innerHTML=''})};
  return ()=>pick;
}
function newTrip(){
  hap();let kind='flight';const t0=new Date().toISOString().slice(0,10);
  modal(`<div class="form"><button class="x" aria-label="Close">✕</button><h2>${tx('create')}</h2>
  <label>${tx('kind')}</label><div class="chips" id="kc">${Object.keys(KIND).map(k=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${k===kind}">${KIND[k]} ${tx(k)}</button>`).join('')}</div>
  <label for="dest">${tx('where')}</label><input class="f" id="dest" placeholder="${tx('ph')}" autocomplete="off"><div class="opts" id="opts"></div>
  <div class="two"><div><label for="df">${tx('from')}</label><input class="f" id="df" type="date" min="${t0}"></div><div><label for="dt">${tx('to')}</label><input class="f" id="dt" type="date" min="${t0}"></div></div>
  <div class="two"><div><label for="pp">${tx('people')}</label><input class="f" id="pp" type="number" min="1" max="20" value="1"></div><div><label for="bd">${tx('budget')}</label><input class="f" id="bd" placeholder="€800"></div></div><p class="mu" style="margin:-4px 0 12px;font-size:14px">${tx('limitnote')}</p>
  <label>${tx('who_t')}</label><div class="seg" id="au2"></div>
  <label>${tx('age_t')}</label><div class="two"><div><input class="f" id="a1" type="number" min="18" max="99" placeholder="18"></div><div><input class="f" id="a2" type="number" min="18" max="99" placeholder="99"></div></div>
  <label class="sw"><input type="checkbox" id="ap"><span>${tx('approval')}<br><small class="mu">${tx('approval_h')}</small></span></label>
  <label for="nt">${tx('plan_l')}</label><textarea class="f" id="nt" placeholder="${tx('phn')}"></textarea>
  <button class="cta pri" id="pub">${tx('publish')}</button></div>`);
  document.querySelectorAll('#kc .chip').forEach(b=>b.onclick=()=>{kind=b.dataset.k;hap();document.querySelectorAll('#kc .chip').forEach(o=>o.setAttribute('aria-pressed',o===b))});
  const getPick=picker($('#dest'),$('#opts'));
  let aud='all';seg($('#au2'),[['all',tx('aud_all')],['f',tx('aud_f')],['m',tx('aud_m')]],aud,v=>aud=v);
  $('#pub').onclick=()=>run(async()=>{
    const v=i=>$('#'+i).value,typed=v('dest').trim();
    if(!typed)throw new Error(tx('nodest'));
    const low=typed.toLowerCase(),c=getPick()||CITY.find(c=>c.en.toLowerCase()===low||c.ru.toLowerCase()===low);
    await api('/trips','POST',{dest:c?c.en:typed,country:c?c.ce:'',lat:c?c.lat:null,lon:c?c.lon:null,kind,date_from:v('df'),date_to:v('dt'),people:+v('pp')||1,budget:v('bd'),note:v('nt'),audience:aud,min_age:+v('a1')||0,max_age:+v('a2')||0,approval:$('#ap').checked?1:0});
    good();closeM();toast(tx('posted'));show('pass');
  });
}
function deep(){
  const P=new URLSearchParams(location.search),c=P.get('chat'),r=P.get('rate'),t=P.get('trip'),rq=P.get('req');
  if(rq)run(async()=>{openRequests(await api('/trips/'+(+rq)))});else if(c)openChat(+c);else if(r)openRate(+r);else if(t)run(async()=>{openPass(await api('/trips/'+(+t)))});
}
shell();show('board');
setTimeout(()=>run(async()=>{const m=await api('/me');ME=m;if(m.rules_ok&&m.registered)deep()}),2800);
</script>
