name: travelfriends

x-backend: &backend
  build:
    context: ./backend
    target: production
  environment: &environment
    ENV_FILE: /dev/null
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://travelfriends:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/travelfriends}
    MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:-postgresql+psycopg://travelfriends:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/travelfriends}}
    BOT_TOKEN: ${BOT_TOKEN:-}
    BOT_USERNAME: ${BOT_USERNAME:-}
    WEBAPP_URL: ${WEBAPP_URL:-http://localhost:8080}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ADMIN_ID: ${ADMIN_ID:-0}
    BOOST_STARS: ${BOOST_STARS:-50}
    SESSION_TTL: ${SESSION_TTL:-2592000}
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    PORT: '8000'
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: travelfriends
      POSTGRES_DB: travelfriends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U travelfriends -d travelfriends]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [ alembic, -c, alembic.ini, upgrade, head ]

  api:
    <<: *backend
    ports:
      - '${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    environment:
      PORT: '8080'
    ports:
      - '${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  bot:
    <<: *backend
    profiles: [telegram]
    command: [python, -m, app.worker]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
