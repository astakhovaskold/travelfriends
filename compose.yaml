name: travelfriends
x-backend: &backend
  build: .
  environment: &environment
    DATABASE_URL: postgresql+psycopg://travelfriends:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/travelfriends
    BOT_TOKEN: ${BOT_TOKEN:-}
    BOT_USERNAME: ${BOT_USERNAME:-}
    WEBAPP_URL: ${WEBAPP_URL:-http://localhost:8000}
    ADMIN_ID: ${ADMIN_ID:-0}
    BOOST_STARS: ${BOOST_STARS:-50}
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    FRONTEND_RELEASE: ${FRONTEND_RELEASE:-0}
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: travelfriends
      POSTGRES_DB: travelfriends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U travelfriends -d travelfriends]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
  api:
    <<: *backend
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  bot:
    <<: *backend
    profiles: [telegram]
    command: [python, -m, app.worker]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  tests:
    <<: *backend
    profiles: [test]
    environment:
      <<: *environment
      COVERAGE_FILE: /app/coverage/.coverage
      TEST_DATABASE_URL: postgresql+psycopg://travelfriends:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/travelfriends
    command: [python, -m, pytest, --cov=app, --cov-report=term-missing, -q]
    user: "10001:10001"
    tmpfs:
      - /app/.pytest_cache:uid=10001,gid=10001
      - /app/coverage:uid=10001,gid=10001
    working_dir: /app
volumes:
  postgres_data:
