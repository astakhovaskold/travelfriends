<style>

.empty{text-align:center;padding:60px 20px}.empty h2{font-size:24px;margin-bottom:6px}
nav{display:flex;align-items:center;justify-content:space-around;padding-top:6px}

.plus{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:58px;height:58px;border-radius:50%;border:0;background:var(--a0);color:var(--ink);font-size:32px;line-height:1;padding:0;box-shadow:0 8px 26px #FF6B4A66;z-index:5}

.who{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.who h2{font-weight:800;font-size:24px}.who>div{flex:1;min-width:0}
.ava{width:62px;height:62px;border-radius:50%;background:var(--a4);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;overflow:hidden;flex:none}

.scroll h3{font-weight:800;font-size:18px;margin:18px 0 10px}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:8px 14px;color:var(--mu)}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:4px}
.st{aspect-ratio:1;border:3px solid var(--a);outline:1.5px dashed var(--a);outline-offset:3px;border-radius:50%;background:none;color:var(--a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;font-weight:800;font-size:13px;line-height:1.1;transform:rotate(var(--r));overflow-wrap:anywhere;overflow:hidden}

.chip{flex:none;background:var(--deep);border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}

.opts{margin:-8px 0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.opts:empty{display:none}
.opt{display:block;width:100%;text-align:left;background:var(--night);border:0;border-bottom:1px solid var(--line);padding:10px 12px;font-size:15px}
.chatc{margin:auto;text-align:center;max-width:320px;display:flex;flex-direction:column;gap:12px;align-items:center}
.chatc .big{font-size:56px}.chatc h2{font-weight:800;font-size:24px}
.cta.alt{background:none;border:1px solid var(--line);color:var(--tx);margin-top:10px}
.big{font-size:56px;line-height:1.1;margin-bottom:6px}
.ex{background:var(--night);border:1px dashed var(--line);border-radius:14px;padding:12px;margin:12px 0;color:var(--a0)}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}

.rules{padding-left:20px;margin:10px 0}.rules li{margin-bottom:8px}
.bt{margin:12px 0}.bt .ghost{flex:1}
.cb{display:flex;flex-direction:column;height:min(82vh,680px)}
.ch{padding:18px 56px 6px 20px}.ch b{font-weight:800;font-size:20px;display:block}
.note{padding:0 20px 8px;font-size:13px;color:var(--mu)}
.msgs{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;background:var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}
.m.me{align-self:flex-end;background:var(--a0);color:var(--ink);border-radius:16px 16px 4px 16px}
.m small{display:block;font-size:12px;font-weight:700;color:var(--blue);margin-bottom:2px}
.rp{background:none;border:0;color:var(--mu);font-size:12px;padding:0 4px}
.send{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.send .f{margin:0;flex:1}
.sb{width:48px;border:0;border-radius:14px;background:var(--a0);color:var(--ink);font-size:20px}
.ms{position:fixed;inset:0;background:#0B1B3Fee;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
.ms.on{opacity:1;pointer-events:auto}
.mb{position:relative;width:100%;max-width:420px;max-height:92%;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:26px;transform:perspective(900px) rotateX(40deg) translateY(50px);transition:transform .45s cubic-bezier(.2,.9,.3,1.1)}
.ms.on .mb{transform:none}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:#0B1B3F22;color:var(--ink);font-size:18px;z-index:2}
.form{padding:24px 20px 20px}.form h2{font-weight:800;font-size:24px;margin-bottom:14px}
.form .x{background:var(--line);color:var(--tx)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.two{display:flex;gap:10px;align-items:flex-end}.two>div{flex:1;min-width:0}
.pt{background:var(--a);color:var(--ink);padding:22px 20px 18px}
.mini{font-size:13px;font-weight:700;opacity:.75;margin-right:40px}
.pt h2{font-weight:800;font-size:clamp(32px,11vw,46px);line-height:1;margin:10px 0 14px;overflow-wrap:anywhere;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid small{display:block;font-size:12px;font-weight:700;opacity:.7}.grid b{font-weight:800}
.tearl{border-top:2px dashed #0B1B3F33;position:relative}
.tearl:before,.tearl:after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:#1d2a4a}

.stub{padding:16px 20px 20px;transition:transform .7s cubic-bezier(.5,0,1,.6),opacity .7s;transform-origin:0 0}

.stub p{margin-bottom:12px}
.bar{height:34px;margin-bottom:14px;opacity:.7;background:repeating-linear-gradient(90deg,var(--tx) 0 2px,transparent 2px 5px,var(--tx) 5px 6px,transparent 6px 10px)}
.cta{width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:17px;background:var(--ink);color:#fff}

.stamp{position:absolute;left:50%;top:36%;width:132px;height:132px;margin:-66px;border:5px solid var(--ink);outline:2px dashed var(--ink);outline-offset:5px;border-radius:50%;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:22px;transform:rotate(-14deg);animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none}

.sent{padding:14px 20px 20px;font-weight:700;color:var(--a3)}
.toast{position:fixed;left:16px;right:16px;bottom:100px;background:var(--ink);color:#fff;font-weight:700;padding:12px;border-radius:12px;text-align:center;z-index:30}

.orb{position:relative;width:150px;height:150px;margin-bottom:56px}
.earth{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 30%,#5FD8FF,#1B6DFF 55%,#0A2A8C);box-shadow:0 0 50px #35D0FF55}

.land{display:flex;width:600px;animation:spin 9s linear infinite}
.land svg{width:300px;height:150px;flex:none}

.ring{position:absolute;inset:-38px;border:1.5px dashed #ffffff40;border-radius:50%;animation:orbit 6s linear infinite}
.plane{position:absolute;top:-14px;left:50%;margin-left:-13px;transform:rotate(90deg)}

.lnk{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;text-align:left}
.rt{color:var(--a0);font-weight:800;white-space:nowrap}.rt.n{color:#0F9D6E}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}

.tgp{display:inline-block;background:var(--line);border-radius:99px;padding:3px 10px;font-size:13px;margin:4px 6px 2px 0}

.sp{display:flex;gap:4px;justify-content:center;margin:10px 0}

.mr{display:flex;align-items:center;gap:8px;padding:6px 0}

.m.sys{align-self:center;background:none;border-radius:0;color:var(--mu);font-size:13px;padding:2px 8px;text-align:center;max-width:92%}
.pt .lnk{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;margin-bottom:12px;color:#fff;background:linear-gradient(120deg,#0E2A6B,#1E6FD9 60%,#4DB2FF);flex:none}

.pop{display:flex;gap:10px;overflow-x:auto;margin-bottom:12px;flex:none;padding-bottom:2px}

.sw{display:flex;align-items:center;gap:10px;margin:2px 0 12px}.sw input{width:22px;height:22px;accent-color:var(--a0)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg .chip{flex:1;text-align:center;padding:8px 6px}
.match{display:inline-block;background:#2FC48D33;color:#0F7A57;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;margin-top:6px}
.badge{display:inline-block;border:1px solid var(--line);background:var(--night);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
.req{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.req .mid{flex:1;min-width:0}.req .ghost.sm.ok{background:var(--a3);border-color:var(--a3);color:var(--ink)}
</style>

  $('#body').innerHTML=`<div class="hero"><h2>${tx('hero_h')}</h2><p>${tx('hero_p')}</p><span class="pl">✈️</span></div><div class="pop" aria-label="${tx('popt')}">${POP.map(([en,e])=>`<button data-c="${en}"><span>${e}</span>${esc(dn(en))}</button>`).join('')}</div><input class="q" id="q" type="search" placeholder="${tx('search')}" value="${esc(q)}"><div class="chips" id="chips">${['all',...Object.keys(KIND)].map(k=>`<button class="chip" data-k="${k}" aria-pressed="${k===kindF}">${k==='all'?'':KIND[k]+' '}${tx(k)}</button>`).join('')}</div><div class="list" id="list"></div>`;
  $('#q').oninput=e=>{q=e.target.value;paint()};
  document.querySelectorAll('.pop button').forEach(b=>b.onclick=()=>{q=q===dn(b.dataset.c)?'':dn(b.dataset.c);$('#q').value=q;hap();paint()});
  document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{kindF=b.dataset.k;hap();board()});
  load();
}
const load=()=>run(async()=>{list=await api('/trips');paint()});
function paint(){
  const el=$('#list');if(!el)return;
  const n=q.trim().toLowerCase();
  view=list.filter(x=>(kindF==='all'||x.kind===kindF)&&hay(x).includes(n));
  el.innerHTML=view.length?view.map(row).join(''):`<div class="empty"><h2>${tx('e1')}</h2><p class="mu">${tx('e2')}</p></div>`;
  el.querySelectorAll('.flt').forEach(b=>b.onclick=()=>openPass(view[+b.dataset.i]));
}
function chat(){

function share(x){
  if(!BOT){toast(tx('err_notfound'));return}
  const link=`https://t.me/${BOT}?start=trip_${x.id}`;
  tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(`${ke(x)} ${dn(x.dest)}: ${tx('sharetxt')}`));
}

function passBadges(x){
  const b=[];
  if(x.audience==='f')b.push('♀ '+tx('for_f'));if(x.audience==='m')b.push('♂ '+tx('for_m'));
  if(x.min_age||x.max_age)b.push(`${x.min_age||18}–${x.max_age||'∞'} ${tx('yo')}`);
  if(x.approval)b.push('📩 '+tx('byreq'));
  const mv=new Set((ME.vibe||'').split(',').filter(Boolean)),av=(x.a_vibe||'').split(',').filter(Boolean),n=av.filter(v=>mv.has(v)).length;
  return `<p>${b.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</p>${av.length?`<p>${vibeBadges(av)}</p>`:''}${!x.mine&&n?`<span class="match">✨ ${tx('match').replace('{n}',n)}</span>`:''}`;
}
function openPass(x){
  hap('medium');
  const left=Math.max(0,x.people-(x.members||0)),mine=!!x.mine,joined=!!x.joined;
  const rate=x.a_cnt?`★ ${x.a_avg} (${x.a_cnt})`:tx('newbie');
  modal(`<div class="pass"><button class="x" aria-label="Close">✕</button><div class="pt a${ci(x.dest)}"><div class="mini">Travel Friends · ${tx('pass')}</div><h2>${esc(dn(x.dest))}</h2><div class="grid"><div><small>${tx('who')}</small><b><button class="lnk" id="au">${esc(x.name)}</button>${x.age?', '+x.age:''}</b><small>${rate}</small></div><div><small>${tx('when')}</small><b>${rng(x)}</b></div><div><small>${tx('seats')}</small><b>${left} / ${x.people}</b></div><div><small>${tx('budget')}</small><b>${esc(x.budget||'—')}</b></div></div></div><div class="tearl"></div><div class="stub">${x.note?`<p>${esc(x.note)}</p>`:''}${x.about?`<p class="mu">${esc(x.name)}${x.city?', '+esc(x.city):''}: ${esc(x.about)}</p>`:''}${passBadges(x)}<div class="bar"></div><div id="acts"></div></div></div>`);
  $('#au').onclick=()=>openProfile(x.author_id||x.user_id,()=>openPass(x));
  const acts=[],add=(t,fn,o)=>acts.push({t,fn,...(o||{})});
  if(mine||joined){
    if(x.chat_open)add(tx('openchat'),()=>openChat(x.id));
    else add(`${tx('waiting')}: ${x.members||0}/${x.people}`,null,{dis:1});
    if(x.ended&&x.to_rate>0)add('⭐ '+tx('rate'),()=>openRate(x.id),{alt:1});
    if(mine&&x.pending>0)add('📩 '+tx('reqs_t')+' ('+x.pending+')',()=>openRequests(x));
    if(mine&&!x.ended&&!x.closed){
      add(tx('boost'),()=>run(async()=>{const {link}=await api(`/trips/${x.id}/boost`,'POST');tg.openInvoice(link,s=>{if(s==='paid'){good();closeM();toast(tx('boosted'));show(tab)}})}),{alt:1});
      add(tx('close'),()=>ask(tx('q_close'),()=>run(async()=>{await api(`/trips/${x.id}/close`,'POST');good();closeM();toast(tx('closedt'));show(tab)})),{alt:1});
    }
    add('🔗 '+tx('share'),()=>share(x),{alt:1});
  }else{
    if(x.ended)add(tx('ended_t'),null,{dis:1});
    else if(x.closed)add(tx('closedt'),null,{dis:1});
    else if(left<=0)add(tx('fullt'),null,{dis:1});
    else if(x.req==='pending')add(tx('req_pend'),null,{dis:1});
    else if(x.req==='declined')add(tx('err_declined'),null,{dis:1});
    else add(x.approval?tx('req_send'):tx('join'),()=>run(async()=>{
      const r=await api(`/trips/${x.id}/join`,'POST');
      if(r.pending){x.req='pending';good();toast(tx('req_sent'));openPass(x);return}
      x.joined=1;x.members=(x.members||0)+1;x.chat_open=1;good();
      $('.pass').insertAdjacentHTML('beforeend',`<div class="stamp">${tx('going')}</div>`);
      $('.stub').classList.add('torn');toast(tx('chatopen'));
      setTimeout(()=>openChat(x.id),1800);
    }));
    add('🔗 '+tx('share'),()=>share(x),{alt:1});
  }
  $('#acts').innerHTML=acts.map((a,i)=>`<button class="cta${a.alt?' alt':a.t===tx('join')||a.t===tx('req_send')?' pri':''}" data-i="${i}"${a.dis?' disabled':''}>${esc(a.t)}</button>`).join('');
  document.querySelectorAll('#acts .cta').forEach(b=>{const a=acts[+b.dataset.i];if(a.fn)b.onclick=a.fn});
}

  const rs=await api(`/trips/${x.id}/requests`);
  modal(`<div class="form"><button class="x" aria-label="Close">✕</button><h2>${tx('reqs_t')}</h2><p class="mu">${esc(dn(x.dest))}</p>${rs.length?rs.map(r=>`<div class="req"><div class="mid"><button class="lnk" data-p="${r.id}">${esc(r.name)}</button>${r.age?', '+r.age:''}<p>${r.a_cnt?'★ '+r.a_avg+' ('+r.a_cnt+')':tx('newbie')}</p></div><button class="ghost sm ok" data-a="${r.id}">${tx('acc')}</button><button class="ghost sm" data-d="${r.id}">${tx('dec')}</button></div>`).join(''):`<p class="mu">${tx('noreqs')}</p>`}</div>`);
  const again=()=>{x.pending=Math.max(0,(x.pending||1)-1);x.members=(x.members||0);openRequests(x)};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openProfile(+b.dataset.p,()=>openRequests(x)));
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>run(async()=>{await api(`/trips/${x.id}/requests/${b.dataset.a}/accept`,'POST');x.members=(x.members||0)+1;x.chat_open=1;good();again()}));
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>run(async()=>{await api(`/trips/${x.id}/requests/${b.dataset.d}/decline`,'POST');hap();again()}));
})}
async function openChat(id){
  hap();let since=0,first=true,info=null,panel=false;
  modal(`<div class="cb"><button class="x" aria-label="Close">✕</button><div class="ch"><b id="ct"></b><button class="ghost sm" id="cm">👥</button></div><div id="mp"></div><p class="note">${tx('chatnote')}</p><div class="msgs" id="msgs"></div><div class="send"><input class="f" id="mi" maxlength="1000" placeholder="${tx('msgph')}" autocomplete="off"><button class="sb" id="sb" aria-label="Send">➤</button></div></div>`);
  const back=()=>openChat(id);
  const drawPanel=()=>{
    const el=$('#mp');if(!el)return;
    if(!panel||!info){el.innerHTML='';return}
    const me=info.me,au=info.author_id===me;
    el.innerHTML=`<div class="mpanel">${info.members.map(m=>`<div class="mr"><div class="mid"><button class="lnk" data-p="${m.id}">${esc(m.name)}</button>${m.is_author?` <span class="tag a0">${tx('author')}</span>`:''}<p>${m.age?yo(m.age)+' · ':''}${m.a_cnt?'★ '+m.a_avg+' ('+m.a_cnt+')':tx('newbie')}</p></div>${info.ended&&m.id!==me&&!m.rated?`<button class="ghost sm" data-r="${m.id}">⭐</button>`:''}${au&&m.id!==me?`<button class="ghost sm" data-k="${m.id}">${tx('kick')}</button>`:''}</div>`).join('')}<div class="two bt">${au?(info.closed||info.ended?'':`<button class="ghost" id="pc">${tx('close')}</button>`):`<button class="ghost" id="pl">${tx('leave')}</button>`}<button class="ghost" id="ps">🔗 ${tx('share')}</button></div></div>`;
    el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openProfile(+b.dataset.p,back));
    el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openRate(id,+b.dataset.r));
    el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>ask(tx('q_kick'),()=>run(async()=>{await api(`/trips/${id}/kick`,'POST',{user_id:+b.dataset.k});hap();pull()})));
    const pc=$('#pc'),pl=$('#pl');
    if(pc)pc.onclick=()=>ask(tx('q_close'),()=>run(async()=>{await api(`/trips/${id}/close`,'POST');good();toast(tx('closedt'));pull()}));
    if(pl)pl.onclick=()=>ask(tx('q_leave'),()=>run(async()=>{await api(`/trips/${id}/leave`,'POST');closeM();show(tab)}));
    $('#ps').onclick=()=>share({id,dest:info.dest});
  };
  const pull=async()=>{
    if(!$('#msgs')){clearInterval(poll);return}
    try{
      const d=await api(`/trips/${id}/chat?since=${since}`),box=$('#msgs');if(!box)return;
      info=d;$('#ct').textContent=dn(d.dest);$('#cm').textContent=`👥 ${d.members.length} ${panel?'▴':'▾'}`;drawPanel();
      const stick=first||box.scrollTop+box.clientHeight>=box.scrollHeight-40;
      d.messages.forEach(m=>{since=m.id;
        if(m.user_id===0){box.insertAdjacentHTML('beforeend',`<div class="m sys">${esc(sysText(m.text))}</div>`);return}
        const me=m.user_id===d.me;
        box.insertAdjacentHTML('beforeend',`<div class="m ${me?'me':''}">${me?'':`<small><button class="lnk" data-p="${m.user_id}">${esc(m.name)}</button> <button class="rp" data-m="${m.id}" aria-label="${tx('report')}">⚑</button></small>`}${esc(m.text)}</div>`)});
      box.querySelectorAll('[data-p]:not([data-b]),.rp:not([data-b])').forEach(b=>{b.dataset.b=1;
        if(b.dataset.p)b.onclick=()=>openProfile(+b.dataset.p,back);
        else b.onclick=()=>run(async()=>{await api(`/messages/${b.dataset.m}/report`,'POST');toast(tx('reported'))})});
      if(stick)box.scrollTop=box.scrollHeight;
    }catch(e){
      if(e.message==='notmember'){clearInterval(poll);closeM();toast(tx('err_kicked'));return}
      if(first)toast(T[L]['err_'+e.message]||e.message);
    }
    first=false;
  };
  $('#cm').onclick=()=>{panel=!panel;if(info){$('#cm').textContent=`👥 ${info.members.length} ${panel?'▴':'▾'}`;drawPanel()}};
  const send=()=>run(async()=>{const i=$('#mi'),v=i.value.trim();if(!v)return;i.value='';await api(`/trips/${id}/messages`,'POST',{text:v});hap();pull()});
  $('#sb').onclick=send;$('#mi').onkeydown=e=>{if(e.key==='Enter')send()};
  await pull();clearInterval(poll);poll=setInterval(pull,4000);
}

  <h3 style="margin:16px 0 8px;font-size:18px">${tx('reviews')}</h3>
  ${p.reviews.length?p.reviews.map(r=>`<div class="rev"><b class="rt">${'★'.repeat(r.stars)}</b> <small>${esc(r.name)} · ${esc(dn(r.dest))}</small>${r.tags.length?`<div>${r.tags.map(k=>`<span class="tgp ${NEG.has(k)?'neg':''}">${tx('tag_'+k)}</span>`).join('')}</div>`:''}${r.text?`<p>${esc(r.text)}</p>`:''}</div>`).join(''):`<p class="mu">${tx('noreviews')}</p>`}
  ${p.me?'':`<div class="two bt"><button class="ghost" id="bl">${p.blocked?tx('unblock'):tx('block')}</button><button class="ghost" id="rpu">${tx('reportu')}</button></div>`}</div>`);

      if(p.blocked)go();else ask(tx('q_block'),go);
    };
    $('#rpu').onclick=()=>run(async()=>{await api(`/users/${id}/report`,'POST');toast(tx('reported'))});
  }

function openRate(tid,only){run(async()=>{
  const d=await api(`/trips/${tid}/people`);
  if(!d.ended)throw new Error('notended');
  const qu=d.members.filter(m=>m.id!==d.me&&!m.rated&&(!only||m.id===only));
  if(!qu.length){toast(tx('norate'));return}
  let i=0;
  const step=()=>{
    if(i>=qu.length){closeM();toast(tx('rated_ok'));show(tab);return}
    const m=qu[i];let s=0;const sel=new Set();
    modal(`<div class="form"><button class="x" aria-label="Close">✕</button><h2>${tx('rate_t')}</h2><p class="mu">${esc(dn(d.dest))}</p><h3 style="margin:10px 0 0;font-size:20px">${esc(m.name)}${m.age?', '+m.age:''}</h3><div class="sp" id="sp">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n}">★</button>`).join('')}</div><div class="chips wrap" id="tgs">${TAGS.map(k=>`<button type="button" class="chip" data-t="${k}" aria-pressed="false">${tx('tag_'+k)}</button>`).join('')}</div><textarea class="f" id="rtx" maxlength="300" placeholder="${tx('rate_ph')}"></textarea><button class="cta" id="go">${tx('rate_send')}</button><button class="cta alt" id="sk">${tx('rate_skip')}</button></div>`);
    document.querySelectorAll('#sp button').forEach(b=>b.onclick=()=>{s=+b.dataset.n;hap();document.querySelectorAll('#sp button').forEach(o=>o.classList.toggle('on',+o.dataset.n<=s))});
    document.querySelectorAll('#tgs .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.t;sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute('aria-pressed',sel.has(k));hap()});
    $('#sk').onclick=()=>{i++;step()};
    $('#go').onclick=()=>run(async()=>{
      if(!s){hap();toast(tx('pickstars'));return}
      await api('/reviews','POST',{trip_id:tid,to_id:m.id,stars:s,tags:[...sel],text:$('#rtx').value});
      good();i++;step();
    });
  };
  step();
})}

function onboarding(must){
  let i=0;const S=T[L].ob,n=S.length+1;
  const draw=()=>{
    const last=i===S.length;
    modal(`<div class="form ob"><button class="x" aria-label="Close">✕</button>${last?`<div class="big">📜</div><h2>${tx('rulesT')}</h2><ul class="rules">${T[L].rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:`<div class="big">${S[i].e}</div><h2>${S[i].h}</h2><p>${S[i].p}</p>${S[i].ex?`<div class="ex">${S[i].ex}</div>`:''}`}<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button class="cta" id="nx">${last?(must?tx('accept'):tx('ok')):tx('next')}</button></div>`,must);
    $('#nx').onclick=()=>{
      if(!last){i++;hap();draw();return}
      if(!must){closeM();return}
      run(async()=>{await api('/rules','POST');good();closeM();gate()});
    };
  };
  draw();
}

    <button class="ghost" id="pub0" style="width:100%">${tx('myprof')}</button>
    <h3>${tx('stamps')}</h3>${all.length?`<div class="stamps">${all.map((x,i)=>`<button class="st a${ci(x.dest)}" data-s="${i}" style="--r:${(ci(x.dest+i)-2.5)*5}deg">${esc(dn(x.dest))}<small>${fmt(x.date_from)||'✈'}</small></button>`).join('')}</div>`:`<p class="mu">${tx('nost')}</p>`}
    ${d.mine.length?`<h3>${tx('mytrips')}</h3>${d.mine.map((x,i)=>row(x,i)).join('')}`:''}</div>`;
    document.querySelectorAll('.st').forEach(b=>b.onclick=()=>openPass(all[+b.dataset.s]));
    document.querySelectorAll('.scroll .flt').forEach(b=>b.onclick=()=>openPass(d.mine[+b.dataset.i]));
    $('#pub0').onclick=()=>openProfile(m.id);
    $('#edit').onclick=()=>{hap();modal(`<div class="form"><button class="x" aria-label="Close">✕</button><h2>${esc(m.name)}</h2><label for="city">${tx('city')}</label><input class="f" id="city" maxlength="60" value="${esc(m.city)}"><label for="ab">${tx('about')}</label><textarea class="f" id="ab" maxlength="500" placeholder="${tx('pha')}">${esc(m.about)}</textarea><label>${tx('vibe_t')}</label><div class="chips wrap" id="vb"></div><button class="cta" id="sv">${tx('save')}</button></div>`);
      const vs=new Set((m.vibe||'').split(',').filter(Boolean));vibePicker($('#vb'),vs);
      $('#sv').onclick=()=>run(async()=>{await api('/profile','POST',{city:$('#city').value,about:$('#ab').value,vibe:[...vs]});refreshMe();good();closeM();toast(tx('saved'));passport()})};
  });
}

function picker(inp,box){
  let pick=null;
  inp.oninput=()=>{pick=null;const v=inp.value.trim().toLowerCase();
    const m=v?CITY.filter(c=>(c.en+' '+c.ru+' '+c.ce+' '+c.cr).toLowerCase().includes(v)).slice(0,6):[];
    box.innerHTML=m.map((c,i)=>`<button type="button" class="opt" data-i="${i}">${esc(L==='ru'?c.ru:c.en)} <span class="mu">${esc(L==='ru'?c.cr:c.ce)}</span></button>`).join('');
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick=m[+b.dataset.i];inp.value=L==='ru'?pick.ru:pick.en;box.innerHTML=''})};
  return ()=>pick;
}
function newTrip(){
  hap();let kind='flight';const t0=new Date().toISOString().slice(0,10);
  modal(`<div class="form"><button class="x" aria-label="Close">✕</button><h2>${tx('create')}</h2>
  <label>${tx('kind')}</label><div class="chips" id="kc">${Object.keys(KIND).map(k=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${k===kind}">${KIND[k]} ${tx(k)}</button>`).join('')}</div>
  <label for="dest">${tx('where')}</label><input class="f" id="dest" placeholder="${tx('ph')}" autocomplete="off"><div class="opts" id="opts"></div>
  <div class="two"><div><label for="df">${tx('from')}</label><input class="f" id="df" type="date" min="${t0}"></div><div><label for="dt">${tx('to')}</label><input class="f" id="dt" type="date" min="${t0}"></div></div>
  <div class="two"><div><label for="pp">${tx('people')}</label><input class="f" id="pp" type="number" min="1" max="20" value="1"></div><div><label for="bd">${tx('budget')}</label><input class="f" id="bd" placeholder="€800"></div></div><p class="mu" style="margin:-4px 0 12px;font-size:14px">${tx('limitnote')}</p>
  <label>${tx('who_t')}</label><div class="seg" id="au2"></div>
  <label>${tx('age_t')}</label><div class="two"><div><input class="f" id="a1" type="number" min="18" max="99" placeholder="18"></div><div><input class="f" id="a2" type="number" min="18" max="99" placeholder="99"></div></div>
  <label class="sw"><input type="checkbox" id="ap"><span>${tx('approval')}<br><small class="mu">${tx('approval_h')}</small></span></label>
  <label for="nt">${tx('plan_l')}</label><textarea class="f" id="nt" placeholder="${tx('phn')}"></textarea>
  <button class="cta pri" id="pub">${tx('publish')}</button></div>`);
  document.querySelectorAll('#kc .chip').forEach(b=>b.onclick=()=>{kind=b.dataset.k;hap();document.querySelectorAll('#kc .chip').forEach(o=>o.setAttribute('aria-pressed',o===b))});
  const getPick=picker($('#dest'),$('#opts'));
  let aud='all';seg($('#au2'),[['all',tx('aud_all')],['f',tx('aud_f')],['m',tx('aud_m')]],aud,v=>aud=v);
  $('#pub').onclick=()=>run(async()=>{
    const v=i=>$('#'+i).value,typed=v('dest').trim();
    if(!typed)throw new Error(tx('nodest'));
    const low=typed.toLowerCase(),c=getPick()||CITY.find(c=>c.en.toLowerCase()===low||c.ru.toLowerCase()===low);
    await api('/trips','POST',{dest:c?c.en:typed,country:c?c.ce:'',lat:c?c.lat:null,lon:c?c.lon:null,kind,date_from:v('df'),date_to:v('dt'),people:+v('pp')||1,budget:v('bd'),note:v('nt'),audience:aud,min_age:+v('a1')||0,max_age:+v('a2')||0,approval:$('#ap').checked?1:0});
    good();closeM();toast(tx('posted'));show('pass');
  });
}
function deep(){
  const P=new URLSearchParams(location.search),c=P.get('chat'),r=P.get('rate'),t=P.get('trip'),rq=P.get('req');
  if(rq)run(async()=>{openRequests(await api('/trips/'+(+rq)))});else if(c)openChat(+c);else if(r)openRate(+r);else if(t)run(async()=>{openPass(await api('/trips/'+(+t)))});
}
shell();show('board');
setTimeout(()=>run(async()=>{const m=await api('/me');ME=m;if(m.rules_ok&&m.registered)deep()}),2800);
</script>
