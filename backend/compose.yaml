name: travelfriends-backend-dev
x-backend: &backend
  build:
    context: .
    target: development
  env_file:
    - path: .env.local
      required: false
  environment: &environment
    ENV_FILE: /dev/null
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://travelfriends:travelfriends_dev@db:5432/travelfriends}
    MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:-postgresql+psycopg://travelfriends:travelfriends_dev@db:5432/travelfriends}}
    WEBAPP_URL: ${WEBAPP_URL:-http://localhost:5173}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    PORT: '8000'
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: travelfriends
      POSTGRES_DB: travelfriends
      POSTGRES_PASSWORD: travelfriends_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ CMD-SHELL, pg_isready -U travelfriends -d travelfriends ]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [ alembic, -c, alembic.ini, upgrade, head ]
  api:
    <<: *backend
    ports:
      - '${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    <<: *backend
    profiles: [ telegram ]
    command: [ python, -m, app.worker ]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  tests:
    <<: *backend
    profiles: [ test ]
    build:
      context: .
      target: tests
    environment:
      <<: *environment
      TEST_DATABASE_URL: postgresql+psycopg://travelfriends:travelfriends_dev@db:5432/travelfriends
      COVERAGE_FILE: /tmp/.coverage
    tmpfs:
      - /app/.pytest_cache:uid=10001,gid=10001
volumes:
  postgres_data:
