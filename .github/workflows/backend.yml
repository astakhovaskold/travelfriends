name: Backend tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: travelfriends_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: travelfriends_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U travelfriends_test'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://travelfriends_test:test_only_password@localhost:5432/travelfriends_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: SQLite contracts and coverage
        env:
          TEST_DATABASE_URL: ""
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90 -q
      - name: PostgreSQL contracts, concurrency and coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90 -q
